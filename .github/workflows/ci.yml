name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  native:
    name: Windows build
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      # Чистая логика острова (пружина, контур, fullscreen, игры) — быстрые юнит-тесты.
      - name: Island tests
        run: dotnet test native/tests/Island.Tests

      - name: Publish
        run: dotnet publish native/Shell/Shell.csproj -c Release -r win-x64 -o native/publish

      # The build is the check; the download is a convenience. A full artifact quota must not
      # turn a good build red, and short retention keeps the quota from filling up.
      - uses: actions/upload-artifact@v4
        continue-on-error: true
        with:
          retention-days: 3
          name: windows-shell-native-${{ github.sha }}
          path: native/publish
          if-no-files-found: error
