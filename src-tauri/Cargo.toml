[package]
name = "windows-shell"
version = "0.1.0"
description = "Personal shell on top of Windows 11"
authors = ["LeDoksi"]
edition = "2021"
rust-version = "1.85"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "windows_shell_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
png = "0.18"
base64 = "0.22"

# Win32 для окон оболочки; спайки (`pnpm tauri dev --features spike`) используют то же самое.
[target.'cfg(windows)'.dependencies]
window-vibrancy = "0.8"
# COM-интерфейсы Проводника (иконки); в windows-sys их нет.
windows = { version = "0.62", features = ["Win32_Graphics_Gdi", "Win32_System_Com", "Win32_UI_Shell"] }
windows-sys = { version = "0.61", features = ["Win32_Graphics_Dwm", "Win32_UI_Accessibility", "Win32_Graphics_Gdi", "Win32_System_Com", "Win32_System_DataExchange", "Win32_System_LibraryLoader", "Win32_System_Registry", "Win32_System_Threading", "Win32_UI_HiDpi", "Win32_UI_Shell", "Win32_UI_Shell_Common", "Win32_UI_WindowsAndMessaging"] }

[features]
spike = []


# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
